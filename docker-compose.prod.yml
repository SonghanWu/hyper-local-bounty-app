version: '3.8'

services:
  # ─── Database ────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:15-3.3
    container_name: bounty-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bounty-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Cache / Geospatial ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bounty-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - bounty-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Database Migrations (runs once, then exits) ─────────────
  # Uses the same image as the app but only runs migration:run,
  # then exits with code 0. The app service waits for this to
  # complete successfully before starting, ensuring the DB schema
  # is always up to date on every deployment.
  migrator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bounty-migrator
    restart: on-failure
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
    # Calls the compiled JS TypeORM CLI directly — no ts-node required
    command: node ./node_modules/.bin/typeorm migration:run -d dist/config/typeorm.config.js
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bounty-network

  # ─── NestJS Application ──────────────────────────────────────
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bounty-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7d}
    # No ports exposed directly — all traffic enters through Nginx
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - bounty-network

  # ─── Nginx Reverse Proxy ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: bounty-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx config (read-only mount)
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Let's Encrypt certificates (mounted after SSL is provisioned)
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - bounty-network

volumes:
  postgres_data:
  redis_data:

networks:
  bounty-network:
    driver: bridge
