# ═══════════════════════════════════════════════════════════════
# PinGig — Nginx Reverse Proxy Configuration
#
# Deployment stages:
#   Stage 1 (no domain / no SSL yet):
#     Use only the HTTP server block below (port 80).
#     Keep the HTTPS block commented out to test the API first.
#
#   Stage 2 (after obtaining a domain + Let's Encrypt certificate):
#     1. Replace YOUR_DOMAIN with your real domain (4 occurrences)
#     2. Uncomment the HTTPS server block
#     3. Replace the HTTP location / block with: return 301 https://$host$request_uri;
# ═══════════════════════════════════════════════════════════════

# Define the NestJS container as an upstream.
# "app" matches the service name in docker-compose.prod.yml.
upstream nestjs_app {
    server app:3000;
}

# ─────────────────────────────────────────────────────────────
# HTTP (port 80)
# Stage 1: proxy directly (for initial testing)
# Stage 2: replace the location block with:
#   return 301 https://$host$request_uri;
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name YOUR_DOMAIN;   # e.g. api.pingig.com — use _ to accept any IP in Stage 1

    # ── Regular HTTP requests ──
    location / {
        proxy_pass         http://nestjs_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── WebSocket (Socket.io) ──
    # Socket.io handshakes on /socket.io/ and requires the Upgrade
    # header to be forwarded; without this Nginx drops the WS connection.
    location /socket.io/ {
        proxy_pass         http://nestjs_app;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;   # signal this is a WS upgrade
        proxy_set_header   Connection "upgrade";        # keep the connection upgraded
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;                     # 24 h — prevents long-lived connections from being cut
    }
}

