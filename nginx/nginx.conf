# ═══════════════════════════════════════════════════════════════
# PinGig — Nginx 反向代理配置
#
# 部署流程说明：
#   阶段一（刚上服务器，还没域名/SSL）：
#     只用 HTTP 的 server 块（下方 port 80 部分），
#     把 HTTPS 的 server 块注释掉即可先测通 API。
#
#   阶段二（拿到域名 + Let's Encrypt 证书后）：
#     1. 把 YOUR_DOMAIN 替换成真实域名（全文共 4 处）
#     2. 取消 HTTPS server 块的注释
#     3. 把 HTTP 的 location / 改成 return 301 跳转（见注释）
# ═══════════════════════════════════════════════════════════════

# 把 NestJS 容器定义为上游，名字 "app" 对应 docker-compose 里的服务名
upstream nestjs_app {
    server app:3000;
}

# ─────────────────────────────────────────────────────────────
# HTTP (port 80)
# 阶段一：直接代理（测试用）
# 阶段二：改为跳转 HTTPS，把下面的 location 块替换成：
#   return 301 https://$host$request_uri;
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name YOUR_DOMAIN;   # 例如: api.pingig.com，阶段一可以写 _;

    # ── 普通 HTTP 请求 ──
    location / {
        proxy_pass         http://nestjs_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── WebSocket (Socket.io) ──
    # Socket.io 的握手路径是 /socket.io/，需要特殊处理 Upgrade 头
    # 否则 WebSocket 连接会直接被 Nginx 断掉
    location /socket.io/ {
        proxy_pass         http://nestjs_app;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;   # 告诉 Nginx 这是 WS 升级请求
        proxy_set_header   Connection "upgrade";        # 保持连接升级
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;                     # 24h，防止长连接被切断
    }
}

