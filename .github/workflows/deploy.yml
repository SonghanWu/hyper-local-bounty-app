name: CI/CD Pipeline

on:
  push:
    branches: [main]

env:
  AWS_REGION:      ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY:  ${{ secrets.ECR_REPOSITORY }}
  ECS_CLUSTER:     ${{ secrets.ECS_CLUSTER }}
  ECS_SERVICE:     ${{ secrets.ECS_SERVICE }}
  TASK_DEFINITION: ecs/task-definition.json
  CONTAINER_NAME:  pingig-app

jobs:
  # ── CI: Integration Tests ─────────────────────────────────────────────
  test:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci --legacy-peer-deps

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Start PostgreSQL and Redis
        working-directory: backend
        run: docker compose up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for PostgreSQL..."
          until docker exec bounty-postgres pg_isready -U bounty_user -d bounty_db; do sleep 2; done
          echo "Waiting for Redis..."
          until docker exec bounty-redis redis-cli ping; do sleep 2; done

      - name: Run database migrations
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: bounty_user
          DB_PASSWORD: bounty_password
          DB_DATABASE: bounty_db
          NODE_ENV: development
        run: npm run migration:run

      - name: Start backend server
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: bounty_user
          DB_PASSWORD: bounty_password
          DB_DATABASE: bounty_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-test-secret-do-not-use-in-prod
          NODE_ENV: development
          PORT: 3000
        run: node dist/main.js &

      - name: Wait for backend to be ready
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Attempt $i/30, retrying in 3s..."
            sleep 3
          done
          echo "Backend failed to start"
          exit 1

      - name: Install test dependencies
        working-directory: tests
        run: npm install

      - name: Run integration tests
        run: bash tests/run-all-tests.sh

  # ── CD: Build → Migrate → Deploy ─────────────────────────────────────
  deploy:
    name: Build → Migrate → Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:    ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./backend
          docker push    $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag  $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                      $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # Render + register the new task definition BEFORE migrating, so the
      # migration task runs the image we are about to deploy. Previously the
      # migration step used the already-registered "pingig-app" task definition
      # — i.e. the PREVIOUS deploy's image — so a migration added in this commit
      # was not present in that container and was silently skipped (migration:run
      # found nothing pending and exited 0).
      - name: Render task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.TASK_DEFINITION }}
          container-name:  ${{ env.CONTAINER_NAME }}
          image:           ${{ steps.build-image.outputs.image }}

      - name: Register new task definition revision
        id: register
        run: |
          set -euo pipefail
          ARN=$(aws ecs register-task-definition \
            --cli-input-json "file://${{ steps.task-def.outputs.task-definition }}" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered task definition: $ARN"
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Run database migrations on Aurora
        run: |
          set -euo pipefail

          # Reuse the running ECS service's network configuration for the one-off
          # migration task. This keeps the task in the same known-good subnets and
          # security group as the live app, instead of the SUBNET_IDS /
          # SECURITY_GROUP_ID secrets which previously drifted and caused
          # intermittent provisioning failures (container never started ->
          # exitCode None -> the whole deploy failed with no usable error).
          RUN_NET=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].networkConfiguration' \
            --output json | jq -c '{awsvpcConfiguration: .awsvpcConfiguration}')
          echo "Using network configuration: $RUN_NET"

          # Migrate using the task definition we just registered (the new image),
          # NOT the family name, so newly added migrations are actually present.
          TASK_DEF="${{ steps.register.outputs.arn }}"
          MIGRATION_CMD='{"containerOverrides":[{"name":"'"$CONTAINER_NAME"'","command":["node","node_modules/.bin/typeorm","migration:run","-d","dist/config/typeorm.config.js"]}]}'

          attempt=1
          max_attempts=2
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "::group::Migration attempt $attempt/$max_attempts"
            TASK_ARN=$(aws ecs run-task \
              --cluster "$ECS_CLUSTER" \
              --task-definition "$TASK_DEF" \
              --launch-type FARGATE \
              --network-configuration "$RUN_NET" \
              --overrides "$MIGRATION_CMD" \
              --query 'tasks[0].taskArn' \
              --output text)
            echo "Migration task: $TASK_ARN"

            aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"

            DESC=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
              --query 'tasks[0].{exit:containers[0].exitCode,stopCode:stopCode,reason:stoppedReason}' \
              --output json)
            EXIT_CODE=$(echo "$DESC" | jq -r '.exit')
            STOP_CODE=$(echo "$DESC" | jq -r '.stopCode')
            STOP_REASON=$(echo "$DESC" | jq -r '.reason')
            echo "exitCode=$EXIT_CODE stopCode=$STOP_CODE stoppedReason=$STOP_REASON"
            echo "::endgroup::"

            if [ "$EXIT_CODE" = "0" ]; then
              echo "Migration completed successfully"
              break
            fi

            # exitCode null means the container never started (a provisioning /
            # ResourceInitialization failure) — transient, so retry once. A real
            # migration error produces a non-null, non-zero exit code: fail fast.
            if { [ "$EXIT_CODE" = "null" ] || [ "$EXIT_CODE" = "None" ]; } && [ "$attempt" -lt "$max_attempts" ]; then
              echo "Container did not start (provisioning failure) — retrying..."
              attempt=$((attempt + 1))
              continue
            fi

            echo "Migration failed (exitCode=$EXIT_CODE, stopCode=$STOP_CODE): $STOP_REASON"
            exit 1
          done

      - name: Deploy to ECS service
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "${{ steps.register.outputs.arn }}" \
            --force-new-deployment >/dev/null
          echo "Waiting for service to stabilize..."
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
          echo "Deployment stable."
