version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: bounty-postgres
    environment:
      POSTGRES_USER: bounty_user
      POSTGRES_PASSWORD: bounty_password
      POSTGRES_DB: bounty_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bounty-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bounty_user -d bounty_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bounty-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bounty-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  bounty-network:
    driver: bridge
